# ==========================================
# Application Configuration
# ==========================================
spring.application.name=custom-clothing-system
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/custom_clothing_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Enter your MySQL root password below after the '=' sign (leave blank if your root user has no password)
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================
# Logging
# ==========================================
logging.level.com.customclothing.system=DEBUG

# ==========================================
# Gmail / JavaMail Configuration
# ==========================================
# SMTP Settings: smtp.gmail.com:587 with Authentication and STARTTLS enabled
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Credentials read securely from environment variables (MAIL_USERNAME / MAIL_PASSWORD) - no hardcoding
spring.mail.username=${MAIL_USERNAME:${GMAIL_USERNAME:${SPRING_MAIL_USERNAME:}}}
spring.mail.password=${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:${SPRING_MAIL_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
